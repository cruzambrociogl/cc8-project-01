<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CTF-GRID v3 — game</title>
<script src="/vendor/phaser.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; background: #0b0f17; color: #e5e7eb; }
  .wrap { max-width: 720px; margin-inline: auto; }
  h1 { font-size: 1rem; margin: 0 0 .8rem; color: #94a3b8; font-weight: 600; }
  .bar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .8rem; }
  input { font: inherit; padding: .35rem .5rem; border-radius: 6px; border: 1px solid #334155; background: #111827; color: inherit; }
  button { font: inherit; padding: .4rem .9rem; border-radius: 6px; cursor: pointer; border: 1px solid #334155; background: #1e293b; color: inherit; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #stage { position: relative; width: 700px; max-width: 96vw; aspect-ratio: 1; margin-inline: auto; }
  #game { width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             text-align: center; background: rgba(11,15,23,.72); border-radius: 10px; gap: .4rem; }
  #overlay.hidden { display: none; }
  #overlayBig { font-size: 2.4rem; font-weight: 700; }
  #overlaySub { color: #94a3b8; }
  .hint { color: #64748b; font-size: 12.5px; margin: .6rem 0; }
  #log { font: 12px/1.5 ui-monospace, monospace; background: #0d1424; border: 1px solid #1e293b; border-radius: 8px;
         padding: .5rem .7rem; height: 120px; overflow-y: auto; margin-top: .8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CTF-GRID v3 — game (Phase 1)</h1>

  <div class="bar">
    <label>Bridge <input id="url" value="ws://localhost:8080" size="22" /></label>
    <label>Name <input id="name" value="Cruz" size="10" maxlength="20" /></label>
    <button id="connect">Connect &amp; join</button>
    <button id="disconnect" disabled>Disconnect</button>
    <span id="status" style="color:#94a3b8"></span>
  </div>

  <div id="stage">
    <div id="game"></div>
    <div id="overlay">
      <div id="overlayBig">Not connected</div>
      <div id="overlaySub">Enter a bridge address and join.</div>
    </div>
  </div>

  <p class="hint">Move: arrows or WASD · Grab / steal the flag: Space or E · Carry it fully outside the circle to win.</p>
  <div id="log"></div>
</div>

<script type="module">
import { NetClient, MATCH_STATE } from "/net.js";
import { startGame } from "/game.js";

const $ = (s) => document.querySelector(s);
const net = new NetClient();
startGame(net);

const ov = { box: $("#overlay"), big: $("#overlayBig"), sub: $("#overlaySub") };
function overlay(big, sub = "") { ov.box.classList.remove("hidden"); ov.big.textContent = big; ov.sub.textContent = sub; }
function hideOverlay() { ov.box.classList.add("hidden"); }
function log(s) {
  const d = document.createElement("div");
  d.textContent = `${new Date().toLocaleTimeString()}  ${s}`;
  $("#log").appendChild(d); $("#log").scrollTop = $("#log").scrollHeight;
}
function setConnected(on) {
  $("#connect").disabled = on; $("#disconnect").disabled = !on;
  $("#status").textContent = on ? "connected" : "disconnected";
}

net.on("open", () => { setConnected(true); log("connected, sent JOIN"); overlay("Joining…"); });
net.on("close", () => { setConnected(false); log("connection closed"); overlay("Disconnected"); });
net.on("neterror", () => log("socket error (is the bridge running?)"));
net.on("log", (s) => log(s));
net.on("event", (s) => log(s));
net.on("joined", (m) => { log(`joined as P${m.playerId}`); overlay("Waiting…", "waiting for the match to start"); });
net.on("lobby", (m) => {
  const list = m.players.map((p) => p.name).join(", ");
  if (net.matchState === MATCH_STATE.WAITING) overlay("Lobby", `players: ${list || "—"}`);
});
net.on("countdown", (n) => overlay(String(n), "get ready"));
net.on("started", () => { hideOverlay(); log("match started"); });
net.on("over", (m) => {
  const you = m.winnerId === net.myId;
  overlay(you ? "You win! 🎉" : `${m.winnerName} wins`, "match over");
  log(`game over — winner ${m.winnerName} (P${m.winnerId})`);
});

$("#connect").onclick = () => {
  const url = $("#url").value.trim();
  const name = $("#name").value.trim() || "player";
  overlay("Connecting…");
  net.connect(url, name);
};
$("#disconnect").onclick = () => net.disconnect();
</script>
</body>
</html>
